<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Air Monitor</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Air Monitor</h1>
        <p id="status">Loading local readings...</p>
      </div>
      <div class="latest" id="latest"></div>
    </header>

    <main>
      <section class="ac-card" id="ac-card" hidden aria-label="Air conditioner">
        <div class="ac-top">
          <h2>Air Conditioner</h2>
          <button type="button" id="ac-power" class="ac-power">—</button>
        </div>
        <div class="ac-readout" id="ac-readout"></div>

        <div class="segmented ac-cmode" id="ac-cmode">
          <button type="button" data-cmode="auto">Automatic</button>
          <button type="button" data-cmode="manual">Manual</button>
        </div>

        <div class="ac-panel" id="ac-auto-panel">
          <div class="ac-fields">
            <label class="ac-field">Target humidity
              <span><input type="number" id="ac-target-hum" min="20" max="90" step="1"> %</span>
            </label>
            <label class="ac-field">Target temperature
              <span><input type="number" id="ac-target-temp" min="16" max="30" step="0.5"> &deg;C</span>
            </label>
            <button type="button" id="ac-save-targets">Save</button>
          </div>
          <p class="ac-note">Temperature drives automation only — it isn't sent to the unit (mocked).</p>
        </div>

        <div class="ac-panel" id="ac-manual-panel" hidden>
          <div class="ac-group">
            <span class="ac-label">Mode</span>
            <div class="segmented" id="ac-mode">
              <button type="button" data-mode="Cool">Cool</button>
              <button type="button" data-mode="Dry">Dry</button>
              <button type="button" data-mode="Fan">Fan only</button>
              <button type="button" data-mode="Auto">Auto</button>
            </div>
          </div>
          <div class="ac-group">
            <span class="ac-label">Fan speed</span>
            <div class="segmented" id="ac-fan">
              <button type="button" data-fan="Low">Low</button>
              <button type="button" data-fan="High">High</button>
              <button type="button" data-fan="Auto">Auto</button>
            </div>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="Chart controls">
        <div class="segmented" id="groups"></div>
        <label class="select-label">
          Window
          <select id="hours">
            <option value="1">1 hour</option>
            <option value="6">6 hours</option>
            <option value="24" selected>24 hours</option>
            <option value="72">3 days</option>
            <option value="168">7 days</option>
          </select>
        </label>
      </section>

      <section class="chart-shell">
        <div class="chart-header">
          <h2 id="chart-title">Comfort</h2>
          <span id="point-count"></span>
        </div>
        <canvas id="chart" width="1200" height="520"></canvas>
        <div class="toggles" id="toggles"></div>
      </section>

      <section class="details">
        <h2>Recent Values</h2>
        <div class="metric-grid" id="metric-grid"></div>
      </section>

      <section class="details">
        <details id="diagnostics">
          <summary>
            <span>Diagnostics</span>
            <span class="diag-badge" id="diag-badge">No errors</span>
          </summary>
          <div class="diag-body">
            <div class="diag-stats" id="diag-stats"></div>
            <table class="diag-table">
              <thead>
                <tr><th>Time</th><th>Stage</th><th>Message</th></tr>
              </thead>
              <tbody id="diag-rows"></tbody>
            </table>
          </div>
        </details>
      </section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
